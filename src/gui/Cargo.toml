[package]
name = "rv-certcheck-gui"
description = "RV CertCheck desktop interface (Windows 10/11, also builds on Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "rv-certcheck-gui"
path = "src/main.rs"

[lib]
name = "rv_certcheck_gui"
path = "src/lib.rs"

[dependencies]
rv-certcheck-core.workspace = true
eframe.workspace = true
serde_json.workspace = true
zeroize.workspace = true

# Native file/folder pickers on Windows (no GTK/portal dependency elsewhere: a text field is used instead).
[target.'cfg(windows)'.dependencies]
rfd.workspace = true

# Icon + version details in the Windows .exe (build.rs; does nothing on other platforms).
[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
# The headless screenshot example writes PNGs (docs/images/gui-*.png).
png = "0.18"
