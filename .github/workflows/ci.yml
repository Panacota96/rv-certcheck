name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned in rust-toolchain.toml (channel and components)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Dependency licences and sources (cargo-deny; no GPL/AGPL/LGPL)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  test:
    needs: lint
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned in rust-toolchain.toml (channel and components)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Strawberry Perl for the vendored OpenSSL build (Git Bash's perl cannot configure OpenSSL for MSVC; no NASM needed, openssl-src builds no-asm without it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) { choco install strawberryperl -y --no-progress }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python helpers (independent verifiers + local test TSA/PKI for the trust tests)
        run: pip install blake3 jsonschema pyhanko
      - name: SoftHSM2 token for the PKCS#11 tests (Linux; the token tests run instead of skipping)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y softhsm2
          dir="$RUNNER_TEMP/softhsm"
          mkdir -p "$dir/tokens"
          printf 'directories.tokendir = %s/tokens\nobjectstore.backend = file\nlog.level = ERROR\n' "$dir" > "$dir/softhsm2.conf"
          export SOFTHSM2_CONF="$dir/softhsm2.conf"
          # A distinctive PIN: the tests grep every output for it, so it must not occur by chance (e.g. in a digest).
          pin="rv-ci-pin-4821"
          softhsm2-util --init-token --free --label rv-certcheck-ci --pin "$pin" --so-pin "rv-ci-so-9035"
          serial=$(softhsm2-util --show-slots | awk '/Serial number:/ && $3 != "" {print $3; exit}')
          module=""
          for m in /usr/lib/softhsm/libsofthsm2.so /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so; do
            if [ -f "$m" ]; then module="$m"; break; fi
          done
          test -n "$serial" && test -n "$module"
          {
            echo "SOFTHSM2_CONF=$SOFTHSM2_CONF"
            echo "RV_TEST_PKCS11_MODULE=$module"
            echo "RV_TEST_PKCS11_SERIAL=$serial"
            echo "RV_TEST_PKCS11_PIN=$pin"
          } >> "$GITHUB_ENV"
      - name: Unit and integration tests (includes docs/usage-cli.md drift check and trust tests)
        shell: bash
        env:
          RV_TEST_PYTHON: python
        run: |
          set -o pipefail
          # Failures are also surfaced as annotations (readable through the API without downloading logs).
          # A hard limit: a hung test must fail the job (and say which test) instead of holding the runner for hours.
          if ! timeout 40m cargo test --workspace --locked 2>&1 | tee test.log; then
            grep -E "panicked at|^---- |FAILED|^failures:|assertion|Error:|error:|error\[|running for over|^     Running" test.log | tail -40 | while IFS= read -r l; do echo "::error title=cargo test::${l}"; done
            # Whatever the failure looks like, the last lines are readable without downloading the job log.
            tail -n 25 test.log | while IFS= read -r l; do echo "::error title=cargo test (tail)::${l}"; done
            exit 1
          fi
      - name: Self-test of the hash implementations
        run: cargo run --locked -q -p rv-certcheck-cli -- self-test
      - name: Sample run (exit 0, or 3 when the sample's expired / revoked / wrong-root certificates are reported)
        shell: bash
        run: |
          code=0
          cargo run --locked -q -p rv-certcheck-cli -- analyze -i examples/sample/evidence --anchor examples/sample/anchors/rakvor-lab-root.crt --at 2026-06-01T00:00:00Z --hash sha256,blake3 --lang all --out ci-out --progress none --no-timestamp || code=$?
          test "$code" -eq 0 || test "$code" -eq 3
      - name: Cross-language verification (Python re-checks the chain, hashes and JSON schemas)
        shell: bash
        run: |
          run=$(find ci-out/logs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)
          python tests/verify_chain.py "ci-out/logs/$run"
          python tests/validate_reports.py "ci-out/reports/$run"
      - name: Sample script (compares the tool's hashes.csv with expected_hashes.csv)
        if: runner.os == 'Linux'
        env:
          RV_NO_TIMESTAMP: "1"
          RV_SAMPLE_OUT: sample-out
        run: |
          cargo build --locked -q -p rv-certcheck-cli
          sh examples/sample/run.sh target/debug/rv-certcheck
      - name: Cross-profile golden case (written by the Python profile; tests/golden/regenerate.py)
        shell: bash
        run: |
          for z in tests/golden/case-by-*.zip.b64; do
            rm -rf golden-out && python tests/golden/unpack.py "$z" golden-out
            cargo run --locked -q -p rv-certcheck-cli -- verify-case golden-out/CASE-GOLDEN
            for logs in golden-out/CASE-GOLDEN/runs/*/*/logs; do
              cargo run --locked -q -p rv-certcheck-cli -- verify-log "$logs"
            done
          done
      - name: Real TSA smoke test (DigiCert; network-dependent, informative)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cargo run --locked -q -p rv-certcheck-cli -- analyze -i examples/sample/evidence --anchor examples/sample/anchors/rakvor-lab-root.crt --at 2026-06-01T00:00:00Z --out tsa-out --progress none | tee tsa.txt
          grep -q "timestamp: ok" tsa.txt
          run=$(find tsa-out/logs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)
          cargo run --locked -q -p rv-certcheck-cli -- verify-log "tsa-out/logs/$run"
      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p rv-certcheck-cli -p rv-certcheck-gui
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: rv-certcheck-windows-x64-${{ github.sha }}
          path: |
            target/release/rv-certcheck.exe
            target/release/rv-certcheck-gui.exe
          retention-days: 14
