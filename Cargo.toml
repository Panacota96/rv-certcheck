[workspace]
resolver = "3"
members = ["src/certs", "src/core", "src/cli", "src/gui"]

[workspace.package]
# Crate version only — never bumped. The product version is version.txt (release-please), so Cargo.lock
# does not change on release and `--locked` builds keep working.
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Rakvor-Audit"
publish = false
rust-version = "1.88"
authors = ["Rakvor"]
repository = "https://github.com/Panacota96/rv-certcheck"

[workspace.dependencies]
rv-certcheck-core = { path = "src/core" }
rv-certcheck-certs = { path = "src/certs" }
# Certificate layer (src/certs). Versions checked on crates.io on 2026-11-03; licences in deny.toml.
# OpenSSL 3 (openssl-src 300.x, vendored: built from source, no system OpenSSL) for path validation, CMS, OCSP,
# CRL, PKCS#12 and the OpenSSL-style text dump. Apache-2.0 (openssl, openssl-src's OpenSSL 3), MIT (openssl-sys).
openssl = { version = "0.10.82", features = ["vendored"] }
# Read-only X.509 field extraction (subject, extensions, policies, name constraints).
x509-parser = "0.18.1"
pem = "4.0.0"
# PKCS#11 hardware tokens (YubiKey, SoftHSM2 in CI).
cryptoki = "0.12.1"
# EU LOTL/TL XML (trust-list import).
quick-xml = "0.42.0"
# OCSP response building for `pki ocsp-sign` (RustCrypto, der 0.7 like x509-cert 0.2 / cms 0.2 / x509-tsp 0.1).
x509-ocsp = "0.2.1"
# Seeded lab material (`lab make --seed N`: serials, salts, IVs and the seeds of lab keys): ChaCha20, used through
# its own rand_core re-export. Lab RSA primes come from that stream (keys.rs seeded_rsa, OpenSSL BIGNUM).
rand_chacha = "0.3.1"
# Passwords, PINs and key bytes are wiped from memory when dropped.
zeroize = { version = "1.9.1", features = ["derive"] }
# Dates and validity periods.
time = "0.3.55"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1.8"
digest = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "3", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2.5"
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
indicatif = "0.18"
ctrlc = "3.5"
# Certificate password prompt without echo.
rpassword = "7.4"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.17"
# Trust: RFC 3161 timestamps + PDF signatures (RustCrypto, pure Rust; versions aligned on der 0.7)
ureq = "3"
p12-keystore = "0.4"
cms = { version = "0.2", features = ["builder"] }
x509-tsp = "0.1"
x509-cert = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["alloc", "oid"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
# RSA PKCS#1 v1.5 PDF signatures of the reports (core, trust.rs).
rsa = { version = "0.9", features = ["sha2"] }
sha2-legacy = { package = "sha2", version = "0.10" }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols are kept (no strip, no UPX): packed or stripped binaries raise antivirus false positives.
